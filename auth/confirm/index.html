<!doctype html>
<html lang="fa" dir="rtl"><head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"><meta charset="utf-8">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تأیید حساب | هیدرویار</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Vazirmatn,Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#f8fbff,#eaf2ff);color:#172033}main{width:min(100%,520px);padding:32px;background:#fff;border:1px solid #dbeafe;border-radius:24px;box-shadow:0 20px 65px #1e3a8a16;text-align:center}.brand{font-size:26px;font-weight:900;color:#2563eb;margin-bottom:18px}h1{font-size:24px;line-height:1.6;margin:8px 0}p,.status{font-size:14px;line-height:2;overflow-wrap:anywhere}.status{padding:12px;border-radius:12px;background:#eff6ff;color:#1e40af;margin:16px 0}.status.success{background:#f0fdf4;color:#166534}.status.error{background:#fef2f2;color:#991b1b}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}a,button{font:inherit;font-weight:800;padding:12px 18px;border-radius:12px;text-decoration:none;cursor:pointer;border:0}.primary{background:#2563eb;color:#fff}.secondary{background:#fff;border:1px solid #dbe3ef;color:#334155}@media(prefers-color-scheme:dark){body{background:#0b1220;color:#e5e7eb}main{background:#111827;border-color:#29364d}.status{background:#10244b;color:#bfdbfe}.status.success{background:#052e16;color:#bbf7d0}.status.error{background:#450a0a;color:#fecaca}.secondary{background:#111827;color:#e5e7eb;border-color:#334155}}
</style></head><body><main><div class="brand">هیدرویار</div><h1 id="title">در حال بررسی تأیید ایمیل…</h1><p id="description">لطفاً چند لحظه صبر کن.</p><div id="status" class="status" role="status" aria-live="polite">در حال اتصال امن به سرویس احراز هویت…</div><div class="actions"><a id="continue" class="primary" href="../../?auth=confirmed">رفتن به هیدرویار</a><button id="openLogin" class="secondary" type="button">ورود به حساب</button></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
 const title=document.getElementById('title'),desc=document.getElementById('description'),status=document.getElementById('status');
 const show=(kind,h,m)=>{title.textContent=h;desc.textContent=m;status.className='status'+(kind?' '+kind:'');status.textContent=m;};
 const q=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.replace(/^#/,''));const code=q.get('error_code')||q.get('error')||hash.get('error_code')||hash.get('error');
 if(code){show('error',/expired|invalid|otp/i.test(code)?'لینک تأیید منقضی یا نامعتبر است':'تأیید ایمیل انجام نشد','لینک ممکن است قبلاً استفاده شده یا اعتبارش تمام شده باشد. به هیدرویار برگرد و درخواست لینک تازه بده.');return;}
 if(!window.supabase){show('error','اتصال تأیید بارگذاری نشد','کتابخانهٔ احراز هویت بارگذاری نشد. اینترنت را بررسی و صفحه را تازه کن.');return;}
 const client=window.supabase.createClient('https://ywmojbhkllptfynqzptx.supabase.co','sb_publishable_M8ez0tU2n3XW-CCF0tsBQw_7BnAtY1R',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const succeed=()=>{show('success','ایمیل با موفقیت تأیید شد','حساب کاربری‌ات تأیید شده است. برای ادامه به هیدرویار برگرد.');document.getElementById('continue').href='/?auth=confirmed';document.getElementById('openLogin').textContent='رفتن به هیدرویار';};
 const tokenHash=q.get('token_hash'),type=q.get('type');
 try{
  // Supabase JS automatically handles its standard ?code= callback during initialization.
  // For custom templates that pass token_hash, verify the one-time token explicitly.
  if(tokenHash&&type){const {error}=await client.auth.verifyOtp({token_hash:tokenHash,type});if(error)throw error;}
  const {data,error}=await client.auth.getSession();if(error)throw error;
  if(data.session?.user)succeed();else show('','درخواست تأیید بررسی شد','اگر حسابت هنوز تأیید نشده، از سایت درخواست لینک تازه بده و ایمیل جدید را باز کن.');
 }catch(e){show('error','لینک تأیید معتبر نیست','این لینک شاید قبلاً استفاده شده یا منقضی شده باشد. از سایت درخواست لینک تازه بگیر.');}
 document.getElementById('openLogin').addEventListener('click',()=>location.href='../../?auth=login');
})();
</script></body></html>
